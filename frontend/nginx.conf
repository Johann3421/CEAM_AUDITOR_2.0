server {
    listen 80;
    server_name localhost;

    # 1. Bloquear acceso a archivos y directorios ocultos (.env, .git, etc.) excepto .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. Bloquear extensiones sensibles o ejecutables típicos de CMS / backend
    location ~* \.(php|aspx?|jsp|cgi|env|git|yml|yaml|ini|log|conf|sql|bak|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Bloquear escaneos típicos de WordPress, CMS y exploits conocidos
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|_ignition|cgi-bin|phpmyadmin) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 4. Assets estáticos (JS, CSS, imágenes, fuentes) con caché inmutable
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 5. SPA Fallback para React Router
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
